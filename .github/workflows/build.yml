name: Build Bleach Blood Fight 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Godot version
        run: godot --version

      - name: Validate game project
        working-directory: godot_game
        run: |
          godot --headless --editor --path . --quit

      - name: Export Android APK
        working-directory: godot_game
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/BleachBloodFight.apk
          test -s build/BleachBloodFight.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BleachBloodFight-Android
          path: godot_game/build/BleachBloodFight.apk
          if-no-files-found: error
